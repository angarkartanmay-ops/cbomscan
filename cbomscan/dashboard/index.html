<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cryptolens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --panel-2: #f5f7f9;
  --ink: #111a22;
  --ink-2: #4a5662;
  --ink-3: #7b8794;
  --line: #dce2e8;
  --accent: #2749d6;
  --accent-soft: #e4eafd;
  --crit: #c8312b;
  --crit-soft: #fbe7e5;
  --warn: #b0600c;
  --warn-soft: #fbeedc;
  --ok: #2a7f54;
  --ok-soft: #e0f2e9;
  --seg-code: #d3dbe3;
  --seg-data: #e9edf1;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1013;
    --panel: #131a1f;
    --panel-2: #192127;
    --ink: #e7ecf0;
    --ink-2: #a2aeb9;
    --ink-3: #75828e;
    --line: #243038;
    --accent: #7b97ff;
    --accent-soft: #1c2748;
    --crit: #f06a62;
    --crit-soft: #3a1c1b;
    --warn: #e59a4a;
    --warn-soft: #382a15;
    --ok: #55c28a;
    --ok-soft: #14301f;
    --seg-code: #2a3640;
    --seg-data: #1d272e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1013;
  --panel: #131a1f;
  --panel-2: #192127;
  --ink: #e7ecf0;
  --ink-2: #a2aeb9;
  --ink-3: #75828e;
  --line: #243038;
  --accent: #7b97ff;
  --accent-soft: #1c2748;
  --crit: #f06a62;
  --crit-soft: #3a1c1b;
  --warn: #e59a4a;
  --warn-soft: #382a15;
  --ok: #55c28a;
  --ok-soft: #14301f;
  --seg-code: #2a3640;
  --seg-data: #1d272e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.45 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  -webkit-font-smoothing: antialiased;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr); gap: 12px; max-width: 1480px; margin: 0 auto; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }

.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.brand span { color: var(--ink-3); font-size: 12px; }
.controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.field { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 12px; }
select {
  background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
  padding: 6px 28px 6px 10px; max-width: 320px; min-width: 0; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%;
  background-size: 5px 5px; background-repeat: no-repeat;
}
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 6px 12px; transition: background .15s, border-color .15s; }
.btn:hover:not(:disabled) { background: var(--panel-2); border-color: var(--ink-3); }
.btn:disabled { color: var(--ink-3); cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
:root[data-theme="dark"] .btn.primary, :root:not([data-theme="light"]) .btn.primary { color: #0c1013; }
input[type="range"] { width: 130px; accent-color: var(--accent); }
.thr { min-width: 34px; text-align: right; color: var(--ink); }
.reset { background: none; border: 0; padding: 0; color: var(--accent); font-size: 12px; text-decoration: underline; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }

.ident { display: flex; align-items: stretch; flex-wrap: wrap; overflow: hidden; }
.facts { display: flex; flex: 1 1 auto; min-width: 0; margin: 0; }
.fact { padding: 10px 14px; border-right: 1px solid var(--line); min-width: 0; flex: 0 0 auto; }
.fact dt { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 2px; }
.fact dd { margin: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.summary { display: flex; flex: 0 1 auto; margin-left: auto; }
.stat { padding: 10px 16px; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat b { display: block; font-size: 20px; font-weight: 500; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat span { display: block; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.stat.hot b { color: var(--crit); }

.map { padding: 12px 16px 12px; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.head h2 { margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.legend { display: flex; gap: 14px; color: var(--ink-3); font-size: 12px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; border-radius: 2px; vertical-align: -1px; }
.segs { display: flex; gap: 8px; }
.seg { min-width: 84px; display: flex; flex-direction: column; gap: 5px; }
.seg-label { display: flex; flex-direction: column; gap: 0; font-size: 11px; line-height: 1.35; color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.seg-label b { font-weight: 600; color: var(--ink); }
.seg-label span { color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; }
.seg-body { position: relative; height: 46px; border-radius: 3px; background: var(--seg-data); overflow: hidden; }
.seg.code .seg-body { background: var(--seg-code); }
.seg.trailer .seg-body { background: repeating-linear-gradient(135deg, var(--seg-data) 0 6px, var(--seg-code) 6px 7px); }
.mark {
  position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1px; padding: 0; border: 0;
  background: var(--c); opacity: 0.8; transition: opacity .2s, transform .2s;
}
.mark.ref { top: auto; height: 14px; bottom: 0; width: 2px; background: var(--ink); opacity: 0.55; }
.mark.trail { left: 50%; width: 10px; margin-left: -5px; border-radius: 2px; }
.dim .mark:not(.on) { opacity: 0.18; }
.mark.on { opacity: 1; width: 5px; margin-left: -2px; z-index: 2; }
.mark.ref.on { width: 3px; opacity: 0.9; }
.keys { margin-top: 9px; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.keys b { color: var(--ink-2); font-weight: 500; }

.split { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 12px; min-height: 0; }
.col { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.col > .head { padding: 12px 16px 0; }
.scroll { overflow: auto; min-height: 0; flex: 1; }

.row {
  display: grid; grid-template-columns: minmax(150px, 1.3fr) minmax(150px, 2fr) 138px 44px 40px;
  align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 6px 16px; background: none; border: 0; border-bottom: 1px solid var(--line);
  transition: background .15s;
}
.row.th { position: sticky; top: 0; z-index: 3; background: var(--panel); cursor: default; color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 8px; padding-bottom: 8px; }
.row.th span:nth-child(n+4) { text-align: right; }
.row:not(.th):hover { background: var(--panel-2); }
.row.sel { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.row.off { color: var(--ink-3); }
.row.off .bar i { background: var(--ink-3); }
.name { white-space: nowrap; }
.name b { font-weight: 500; }
.name small { color: var(--ink-3); font-size: 11px; margin-left: 6px; }
.conf { display: flex; align-items: center; gap: 10px; }
.bar { position: relative; flex: 1; height: 6px; border-radius: 3px; background: var(--seg-data); }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 3px; background: var(--accent); transition: width .5s cubic-bezier(.2,.7,.2,1); }
.bar b { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink-2); opacity: 0.7; transition: left .15s; }
.conf .mono { width: 34px; text-align: right; font-size: 12px; }
.pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; white-space: nowrap; font-weight: 500; }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.row .mono { text-align: right; font-size: 12px; color: var(--ink-2); }
.sep { padding: 6px 16px; font-size: 11px; color: var(--ink-3); background: var(--panel-2); text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--line); }

.detail-top { padding: 0 16px 12px; border-bottom: 1px solid var(--line); }
.detail-top h3 { margin: 10px 0 6px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.detail-top .big { margin-left: auto; font-family: var(--mono); font-weight: 500; font-size: 16px; }
.kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 4px 12px; margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.sub { margin: 0; padding: 10px 16px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 500; }
.ev { padding: 8px 16px; border-top: 1px solid var(--line); }
.ev:first-of-type { border-top: 0; }
.ev-top { display: flex; align-items: center; gap: 8px; }
.ev-top code { font-family: var(--mono); font-size: 12px; font-weight: 500; }
.tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--line); padding: 0 6px; border-radius: 3px; }
.ev-top .mono { margin-left: auto; font-size: 12px; }
.ev p { margin: 3px 0 0; color: var(--ink-2); font-size: 12px; }
.ev .where { color: var(--ink-3); font-size: 11px; margin-top: 2px; }
.empty { padding: 28px 16px; color: var(--ink-3); text-align: center; }
.note { padding: 10px 16px 14px; color: var(--ink-3); font-size: 12px; }
.err { display: none; padding: 8px 12px; border-radius: 5px; background: var(--crit-soft); color: var(--crit); }
.err.show { display: block; }
.drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--bg) 85%, transparent); z-index: 20; font-size: 18px; border: 2px dashed var(--accent); margin: 10px; border-radius: 8px; }
.drop.show { display: flex; }

@media (max-width: 1000px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-rows: none; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .col { overflow: visible; }
  .scroll { overflow-x: auto; }
  .row { min-width: 560px; }
  .segs { overflow-x: auto; padding-bottom: 4px; }
  .seg { min-width: 120px; }
  .facts { flex-wrap: wrap; }
  .fact { flex: 1 1 40%; border-bottom: 1px solid var(--line); }
  .summary { margin-left: 0; width: 100%; }
  .stat { flex: 1; }
  .fact dd { max-width: 180px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Cryptolens</h1>
      <span>cbomscan firmware inspector</span>
    </div>
    <div class="controls">
      <span class="badge" id="mode" hidden>Sample data</span>
      <label class="field" for="sample">Firmware <select id="sample"></select></label>
      <input type="file" id="file" accept=".bin,.elf,.img" hidden>
      <button class="btn primary" id="upload">Scan a file</button>
      <label class="field" for="thr">Threshold
        <input type="range" id="thr" min="0.05" max="0.99" step="0.01" value="0.5">
        <span class="thr mono" id="thrv">0.50</span>
      </label>
      <button class="reset" id="reset" hidden>reset</button>
      <button class="btn" id="theme" aria-label="Toggle theme">Theme</button>
    </div>
  </header>

  <div class="err" id="err" role="alert"></div>

  <section class="panel ident">
    <dl class="facts" id="facts"></dl>
    <div class="summary" id="summary"></div>
  </section>

  <section class="panel map">
    <div class="head">
      <h2>Where it sits in the ESP32 image</h2>
      <div class="legend">
        <span><i style="background:var(--crit)"></i>Quantum-vulnerable</span>
        <span><i style="background:var(--warn)"></i>Weak today</span>
        <span><i style="background:var(--ok)"></i>Quantum-safe</span>
        <span><i style="background:var(--ink);opacity:.55"></i>Code that reads the selected table</span>
      </div>
    </div>
    <div class="segs" id="segs"></div>
    <div class="keys" id="keys"></div>
  </section>

  <div class="split">
    <section class="panel col">
      <div class="head"><h2>Algorithms</h2><span class="legend" id="tcount"></span></div>
      <div class="scroll" id="table"></div>
    </section>
    <aside class="panel col">
      <div class="head"><h2>Evidence and migration</h2></div>
      <div class="scroll" id="detail"></div>
    </aside>
  </div>
</div>
<div class="drop" id="drop">Drop an ESP32 firmware .bin to scan it</div>

<script>
const EMBEDDED = null;

const state = { samples: [], cache: {}, current: null, selected: null, threshold: 0.5, live: false };
const el = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hex = n => "0x" + n.toString(16).padStart(8, "0");
const size = n => n >= 1024 ? (n / 1024).toFixed(1) + " KB" : n + " B";
const riskText = { critical: "Quantum-vulnerable", high: "Weak today", low: "Quantum-safe" };
const riskClass = { critical: "crit", high: "warn", low: "ok" };
const riskVar = { critical: "var(--crit)", high: "var(--warn)", low: "var(--ok)" };
const groupText = { constants: "Constants", oid: "OID", keys: "Key material", strings: "Strings", names: "Names", hw: "HW registers", "secure-boot": "Secure Boot" };

const detected = f => f.confidence >= state.threshold;

function showError(msg) {
  const box = el("err");
  box.textContent = msg || "";
  box.classList.toggle("show", !!msg);
}

function sorted(r) {
  return r.families.slice().sort((a, b) => a.priority - b.priority || b.confidence - a.confidence);
}

function renderIdent(r) {
  const sb = r.secureBoot.length
    ? r.secureBoot.map(b => `${b.scheme} ${b.keyBits}-bit${b.curve ? " " + b.curve : ""}${b.crcOk ? "" : " (CRC bad)"}`).join(", ")
    : "none found";
  const app = r.app && r.app.project_name ? `${r.app.project_name} ${r.app.version || ""}` : "no app descriptor";
  const facts = [
    ["Chip", r.chip],
    ["Image", `${r.container}, ${size(r.imageSize)}`],
    ["Application", app + (r.app && r.app.idf_ver ? " / " + r.app.idf_ver : "")],
    ["Entry point", `<span class="mono">${esc(r.entry)}</span>`],
    ["SHA-256", `<span class="mono">${esc(r.sha256.slice(0, 10))}</span>`],
    ["Secure Boot V2", sb]
  ];
  el("facts").innerHTML = facts.map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd title="${esc(String(v).replace(/<[^>]+>/g, ""))}">${k === "Entry point" || k === "SHA-256" ? v : esc(v)}</dd></div>`).join("");
  const found = r.families.filter(detected);
  const vuln = found.filter(f => f.quantumVulnerable);
  const top = found.slice().sort((a, b) => a.priority - b.priority || b.confidence - a.confidence)[0];
  el("summary").innerHTML = `
    <div class="stat"><b>${found.length}<small style="font-size:13px;color:var(--ink-3)"> / ${r.families.length}</small></b><span>Found</span></div>
    <div class="stat ${vuln.length ? "hot" : ""}"><b>${vuln.length}</b><span>Vulnerable</span></div>
    <div class="stat"><b>${top && top.priority < 5 ? "P" + top.priority + " " + esc(top.id) : "None"}</b><span>${top && top.priority < 5 ? "Fix first" : "Nothing to migrate"}</span></div>
    <div class="stat"><b>${r.scanMs} ms</b><span>Scan time</span></div>`;
}

function renderMap(r) {
  const total = r.segments.reduce((s, g) => s + g.size, 0) || 1;
  const blocks = r.segments.map(g => ({ type: "seg", seg: g, weight: Math.max(g.size, total * 0.06) }));
  if (r.secureBoot.length) blocks.push({ type: "trailer", weight: total * 0.07 });
  const sel = state.selected ? r.families.find(f => f.id === state.selected) : null;
  const html = blocks.map(b => {
    let label, marks = "", cls = "seg";
    if (b.type === "seg") {
      const g = b.seg;
      cls += g.kind === "code" ? " code" : "";
      label = `<b>${esc(g.region)}</b><span class="mono">${hex(g.addr)} · ${size(g.size)}</span>`;
      r.families.filter(detected).forEach(f => f.evidence.forEach(e => {
        if (e.address == null) return;
        const a = parseInt(e.address, 16);
        if (a < g.addr || a >= g.addr + g.size) return;
        const on = sel && sel.id === f.id ? " on" : "";
        const left = ((a - g.addr) / g.size * 100).toFixed(2);
        marks += `<button class="mark${on}" data-fam="${f.id}" style="left:${left}%;--c:${riskVar[f.risk]}" title="${esc(f.name)} · ${esc(e.rule)} · ${esc(e.address)} · ${e.confidence.toFixed(2)}" aria-label="${esc(f.name)} evidence at ${esc(e.address)}"></button>`;
      }));
      if (sel && detected(sel)) sel.evidence.forEach(e => (e.xrefs || []).forEach(x => {
        const a = parseInt(x, 16);
        if (a < g.addr || a >= g.addr + g.size) return;
        marks += `<span class="mark ref on" style="left:${((a - g.addr) / g.size * 100).toFixed(2)}%" title="Code at ${esc(x)} reads ${esc(e.rule)}"></span>`;
      }));
    } else {
      cls += " trailer";
      label = `<b>Secure Boot</b><span>signature</span>`;
      r.families.filter(detected).forEach(f => f.evidence.forEach(e => {
        if (e.address != null) return;
        const on = sel && sel.id === f.id ? " on" : "";
        marks += `<button class="mark trail${on}" data-fam="${f.id}" style="--c:${riskVar[f.risk]}" title="${esc(f.name)} · ${esc(e.rule)} · ${e.confidence.toFixed(2)}" aria-label="${esc(f.name)} signature block"></button>`;
      }));
    }
    return `<div class="${cls}" style="flex:${Math.round(b.weight)} 1 0"><div class="seg-label">${label}</div><div class="seg-body ${sel ? "dim" : ""}">${marks}</div></div>`;
  }).join("");
  el("segs").innerHTML = html;
  el("keys").innerHTML = r.keys.length ? `<b>Keys found:</b> ${esc(r.keys.join("  ·  "))}` : "<b>Keys found:</b> none";
  el("keys").title = r.keys.join("\n");
}

function renderTable(r) {
  const all = sorted(r);
  const on = all.filter(detected), off = all.filter(f => !detected(f));
  el("tcount").textContent = `threshold ${state.threshold.toFixed(2)}`;
  const row = f => `
    <button class="row ${detected(f) ? "" : "off"} ${state.selected === f.id ? "sel" : ""}" data-id="${f.id}">
      <span class="name"><b>${esc(f.name)}</b><small>${esc(f.primitive)}</small></span>
      <span class="conf"><span class="bar"><i data-w="${(f.confidence * 100).toFixed(1)}"></i><b style="left:${state.threshold * 100}%"></b></span><span class="mono">${f.confidence.toFixed(2)}</span></span>
      <span><span class="pill ${riskClass[f.risk]}">${riskText[f.risk]}</span></span>
      <span class="mono">P${f.priority}</span>
      <span class="mono">${f.evidence.length}</span>
    </button>`;
  el("table").innerHTML =
    `<div class="row th"><span>Algorithm</span><span>Confidence</span><span>Quantum risk</span><span>Priority</span><span>Hits</span></div>` +
    (on.length ? on.map(row).join("") : `<div class="empty">No cryptography found at this threshold.</div>`) +
    (off.length ? `<div class="sep">Below threshold (${off.length})</div>` + off.map(row).join("") : "");
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el("table").querySelectorAll(".bar i").forEach(i => { i.style.width = i.dataset.w + "%"; });
  }));
}

function renderDetail(r) {
  const f = r.families.find(x => x.id === state.selected);
  if (!f) {
    el("detail").innerHTML = `<div class="empty">Select an algorithm to see its evidence.</div>`;
    return;
  }
  const cost = f.costNotes.map(n => `<p class="note" style="padding-top:0;padding-bottom:6px">${esc(n)}</p>`).join("");
  const evs = f.evidence.length
    ? f.evidence.map(e => `
      <div class="ev">
        <div class="ev-top"><code>${esc(e.rule)}</code><span class="tag">${esc(groupText[e.group] || e.group)}</span><span class="mono">${e.confidence.toFixed(2)}</span></div>
        <p>${esc(e.detail)}</p>
        <div class="where mono">${e.address ? esc(e.address) + " · " : ""}${esc(e.region)}${e.xrefs && e.xrefs.length ? " · read by " + esc(e.xrefs.slice(0, 3).join(", ")) : ""}</div>
      </div>`).join("")
    : `<div class="empty">No evidence found for this algorithm.</div>`;
  el("detail").innerHTML = `
    <div class="detail-top">
      <h3>${esc(f.name)} <span class="pill ${riskClass[f.risk]}">${riskText[f.risk]}</span><span class="big">${f.confidence.toFixed(2)}</span></h3>
      <dl class="kv">
        <dt>Fix order</dt><dd>P${f.priority}. ${esc(f.priorityReason)}</dd>
        <dt>Replace with</dt><dd>${esc(f.replacement)}</dd>
        <dt>Today</dt><dd>${esc(f.classicalStatus)}</dd>
        ${f.params.length ? `<dt>Parameters</dt><dd>${esc(f.params.join(", "))}</dd>` : ""}
        ${f.execution ? `<dt>Runs in</dt><dd>${esc(f.execution)}</dd>` : ""}
      </dl>
    </div>
    ${cost}
    <h4 class="sub">Evidence (${f.evidence.length})</h4>
    ${evs}
    ${f.note ? `<p class="note">${esc(f.note)}</p>` : ""}`;
}

function renderAll() {
  const r = state.current;
  if (!r) return;
  renderIdent(r);
  renderMap(r);
  renderTable(r);
  renderDetail(r);
  el("reset").hidden = Math.abs(state.threshold - 0.5) < 0.001;
}

function defaultSelection(r) {
  const top = sorted(r).find(f => f.confidence >= state.threshold);
  return top ? top.id : null;
}

async function load(name) {
  showError("");
  try {
    if (!state.cache[name]) {
      if (state.live) {
        const res = await fetch("/api/scan?sample=" + encodeURIComponent(name));
        if (!res.ok) throw new Error("Could not scan " + name);
        state.cache[name] = await res.json();
      } else {
        state.cache[name] = EMBEDDED.results[name];
      }
    }
    state.current = state.cache[name];
    state.selected = defaultSelection(state.current);
    renderAll();
  } catch (err) {
    showError(err.message);
  }
}

async function scanFile(file) {
  if (!state.live) {
    showError("Scanning your own file needs the local app. Run: python -m cbomscan serve");
    return;
  }
  showError("");
  try {
    const res = await fetch("/api/scan?name=" + encodeURIComponent(file.name), { method: "POST", body: await file.arrayBuffer() });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Scan failed");
    const key = "upload:" + file.name;
    state.cache[key] = data;
    let opt = [...el("sample").options].find(o => o.value === key);
    if (!opt) {
      opt = new Option(file.name + " (uploaded)", key);
      el("sample").insertBefore(opt, el("sample").firstChild);
    }
    el("sample").value = key;
    load(key);
  } catch (err) {
    showError(err.message);
  }
}

function fillSelect(list) {
  const groups = {};
  list.forEach(s => { (groups[s.group] = groups[s.group] || []).push(s); });
  el("sample").innerHTML = Object.keys(groups).map(g =>
    `<optgroup label="${esc(g)}">${groups[g].map(s => `<option value="${esc(s.sample)}">${esc(s.label)}</option>`).join("")}</optgroup>`).join("");
}

async function init() {
  try {
    const res = await fetch("/api/samples");
    if (!res.ok) throw new Error("no server");
    const idx = await res.json();
    state.live = true;
    state.samples = idx.map(s => ({
      sample: s.sample,
      group: s.profile.replace(/_/g, " "),
      label: `${s.variant} · ${s.opt}${s.secure_boot !== "none" ? " · signed" : ""}`
    }));
  } catch (err) {
    if (!EMBEDDED) {
      showError("Start the app with: python -m cbomscan serve");
      return;
    }
    state.samples = EMBEDDED.samples;
    el("mode").hidden = false;
    el("upload").disabled = true;
    el("upload").title = "Run python -m cbomscan serve to scan your own firmware";
  }
  fillSelect(state.samples);
  const pref = "m36rom__Os__full_stack__sbv2_rsa3072";
  const first = state.samples.find(s => s.sample === pref) || state.samples[0];
  if (first) {
    el("sample").value = first.sample;
    load(first.sample);
  }
}

el("sample").addEventListener("change", e => load(e.target.value));
el("upload").addEventListener("click", () => el("file").click());
el("file").addEventListener("change", e => { if (e.target.files[0]) scanFile(e.target.files[0]); e.target.value = ""; });
el("thr").addEventListener("input", e => {
  state.threshold = parseFloat(e.target.value);
  el("thrv").textContent = state.threshold.toFixed(2);
  const r = state.current;
  if (!r) return;
  const sel = r.families.find(f => f.id === state.selected);
  if (!sel || !detected(sel)) state.selected = defaultSelection(r);
  renderAll();
});
el("reset").addEventListener("click", () => {
  el("thr").value = 0.5;
  el("thr").dispatchEvent(new Event("input"));
});
el("table").addEventListener("click", e => {
  const row = e.target.closest(".row[data-id]");
  if (!row) return;
  state.selected = row.dataset.id;
  renderAll();
});
el("segs").addEventListener("click", e => {
  const m = e.target.closest("[data-fam]");
  if (!m) return;
  state.selected = m.dataset.fam;
  renderAll();
  const row = el("table").querySelector(`.row[data-id="${state.selected}"]`);
  if (row) row.scrollIntoView({ block: "nearest" });
});
el("theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme === "dark" ||
    (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  const next = dark ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("cryptolens-theme", next); } catch (err) {}
});
try {
  const saved = localStorage.getItem("cryptolens-theme");
  if (saved) document.documentElement.dataset.theme = saved;
} catch (err) {}

let depth = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); depth++; el("drop").classList.add("show"); });
window.addEventListener("dragleave", () => { depth = Math.max(0, depth - 1); if (!depth) el("drop").classList.remove("show"); });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
  e.preventDefault();
  depth = 0;
  el("drop").classList.remove("show");
  if (e.dataTransfer.files[0]) scanFile(e.dataTransfer.files[0]);
});

init();
</script>
</body>
</html>
